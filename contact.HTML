<!DOCTYPE html>
<html>
<head>
    <title>Contact - Biodata Saya</title>

    <style>

        body {
            margin: 0;
            background-image: url("Sky 2.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            padding-top: 80px;
        }

      
        .navbar {
            background-color: black;
            text-align: center;
            padding: 15px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 20px;
            padding: 8px 15px;
            transition: 0.3s;
        }

        .navbar a:hover {
            background-color: white;
            color: black;
            border-radius: 5px;
        }

        
        .contact-header {
            background-color: black;
            margin: 5px 40px;
            border-radius: 20px;
            padding: 10px;
        }

        .header-content {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .profile-side img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid white;
        }

        .contact-text h1 {
            color: white;
            margin: 0;
            font-size: 24px;
            text-align: center;
        }

        .contact-text p {
            color: white;
            margin: 5px 0 0;
            font-size: 14px;
            text-align: center;
        }

        
        .box {
            margin: 80px 40px 40px 40px;
            padding: 35px;
            background-color: rgba(0,0,0,0.6);
            border-radius: 20px;
            color: white;
        }

       
        .info {
            text-align: center;
            margin-bottom: 30px;
        }

        .info p {
            font-size: 18px;
            line-height: 1.8;
        }

        
        .form-box {
            max-width: 600px;
            margin: auto;
        }

        .form-box input,
        .form-box textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        .form-box textarea {
            height: 120px;
            resize: none;
        }

        .form-box button {
            width: 100%;
            padding: 12px;
            background-color: black;
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .form-box button:hover {
            background-color: white;
            color: black;
        }

       
        .feedback-box {
            margin-top: 40px;
            padding: 20px;
            border-radius: 15px;
            background: rgba(255,255,255,0.12);
            border-left: 5px solid white;
        }

        .feedback-box h2 {
            text-align: center;
            color: white;
            margin-bottom: 15px;
        }

        .feedback-box select,
        .feedback-box textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        .feedback-box button {
            width: 100%;
            padding: 10px;
            background-color: white;
            color: black;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .feedback-box button:hover {
            background-color: black;
            color: white;
            border: 1px solid white;
        }

       
        .footer {
            background-color: black;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
            border-top: 3px solid white;
            font-size: 14px;
        }

       
        @media screen and (max-width:768px) {

            .header-content {
                flex-direction: column;
                text-align: center;
            }

            .profile-side img {
                width: 80px;
                height: 80px;
            }

            .contact-text h1 {
                font-size: 20px;
            }

            .contact-text p {
                font-size: 13px;
            }

            .box {
                margin: 20px;
                padding: 25px;
            }

            .navbar a {
                margin: 8px;
                display: inline-block;
            }
        }

    </style>
</head>
