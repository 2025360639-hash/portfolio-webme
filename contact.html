<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Biodata Saya</title>

    <style>

        body {
            margin: 0;
            background-image: url("sky-2.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            padding-top: 80px;
        }

        /* NAVBAR */
        .navbar {
            background-color: black;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            padding: 10px 0;
        }

        .navbar ul {
            list-style: none;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .navbar ul li {
            display: inline-block;
            margin: 0 8px;
        }

        .navbar ul li a {
            display: inline-block;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border: 1px solid white;
            border-radius: 6px;
            transition: 0.3s;
        }

        .navbar ul li a:hover {
            background-color: white;
            color: black;
        }

        /* HEADER */
        header {
            background-color: black;
            margin: 5px 40px;
            border-radius: 20px;
            padding: 15px;
        }

        .header-content {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .header-content img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid white;
            object-fit: cover;
        }

        .header-text h1 {
            color: white;
            margin: 0;
            font-size: 28px;
        }

        .header-text p {
            color: white;
            margin-top: 5px;
            font-size: 14px;
        }

        /* MAIN */
        main {
            margin: 40px;
            padding: 35px;
            background-color: rgba(0,0,0,0.6);
            border-radius: 20px;
            color: white;
        }

        /* INFO */
        .info {
            text-align: center;
            margin-bottom: 30px;
        }

        .info p {
            font-size: 18px;
            line-height: 1.8;
        }

        .info a {
            color: #00d9ff;
            text-decoration: none;
            font-weight: bold;
        }

        /* FORM */
        .form-box {
            max-width: 600px;
            margin: auto;
        }

        .form-box input,
        .form-box textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        .form-box textarea {
            height: 120px;
            resize: none;
        }

        .form-box button {
            width: 100%;
            padding: 12px;
            background-color: black;
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .form-box button:hover {
            background-color: white;
            color: black;
        }

        /* FEEDBACK */
        .feedback {
            margin-top: 40px;
            padding: 20px;
            border-radius: 15px;
            background: rgba(255,255,255,0.12);
            border-left: 5px solid white;
        }

        .feedback h2 {
            text-align: center;
            color: white;
        }

        .feedback select,
        .feedback textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        .feedback button {
            width: 100%;
            padding: 10px;
            background-color: white;
            color: black;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .feedback button:hover {
            background-color: black;
            color: white;
            border: 1px solid white;
        }

        /* FOOTER */
        footer {
            background-color: black;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
            border-top: 3px solid white;
        }

        /* RESPONSIVE */
        @media screen and (max-width:768px) {

            .navbar ul li {
                display: block;
                margin: 6px 0;
            }

            main {
                margin: 20px;
            }

            .header-content {
                flex-direction: column;
                text-align: center;
            }
        }

    </style>
</head>
